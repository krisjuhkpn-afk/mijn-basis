<!DOCTYPE html>
<html lang="nl">
<head>
 <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Mijn Dashboard</title>
 
<style>
 body {
   margin: 0;
   padding: 30px 15px;
   background: #ffffff;
   font-family: Nunito, sans-serif;
 }
 
 h1 {
   text-align: center;
   color: #7a1735;
   font-size: 28px;
   margin-bottom: 25px;
 }
 
 .dashboard {
   display: grid;
   grid-template-columns: repeat(5, 1fr);
   gap: 12px;
   max-width: 650px;
   margin: 0 auto;
 }
 
 .dashboard img {
   display: block;
   width: 100%;
   height: auto;
 }
 
 .dashboard a {
   display: block;
   text-decoration: none;
 }

 .dashboard a.done img {
    opacity: 0.30;
}

.dashboard a {
    cursor: pointer;
}

 #datum {
   text-align: center;
   margin: 4px 0;
   font-size: 15px;
   font-weight: 400;
}
 
#voortgang {
   text-align: center;
   margin: 4px 0 20px 0;
   font-size: 16px;
   font-weight: 600;
}

.voortgang-balk {
   width: 240px;
   height: 8px;
   background: #f7e8ed;
   border-radius: 10px;
   margin: 0 auto 32px auto;
   overflow: hidden;
}
 
#voortgang-vulling {
   width: 0%;
   height: 100%;
   background: #d9879f;
   border-radius: 10px;
   transition: width 0.3s ease;
}

 @media (max-width: 600px) {
   .voortgang-balk {
       margin-bottom: 18px;
   }
}

 .afspraken {
 max-width: 650px;
 margin: 32px auto 0;
}
 
.afspraken h2 {
 color: #7a1735;
 font-size: 22px;
 margin: 0 0 14px;
}
 
.afspraak {
 display: flex;
 align-items: center;
 gap: 12px;
 background: #fdf2f6;
 border: 1px solid #f3c9d8;
 border-radius: 14px;
 padding: 10px 14px;
 margin-bottom: 10px;
}
 
.tijd {
 background: #f7d6e2;
 color: #7a1735;
 font-weight: 700;
 border-radius: 9px;
 padding: 6px 9px;
 min-width: 48px;
 text-align: center;
}
 
.omschrijving {
 font-size: 16px;
 font-weight: 600;
}
 
</style>
</head>
 
<body>
 
<h1>Mijn Dashboard</h1>
 
 <p id="datum"></p>
<p id="voortgang"></p>

 <div class="voortgang-balk">
   <div id="voortgang-vulling"></div>
</div>
 
 <div class="dashboard">
 <a href="#"><img src="01 lichtbril.png" alt="Lichtbril"></a>
 <a href="#"><img src="02 supplementen.png" alt="Supplementen"></a>
 <a href="#"><img src="03 badderen.png" alt="Badderen"></a>
 <a href="#"><img src="04 aankleden.png" alt="Aankleden"></a>
 <a href="#"><img src="05 tanden poetsen.png" alt="Tanden poetsen"></a>
 
 <a href="#"><img src="06 wandelen.png" alt="Wandelen"></a>
 <a href="#"><img src="07 ontbijt.png" alt="Ontbijt"></a>
 <a href="#"><img src="08 medicatie supplementen.png" alt="Medicatie en supplementen"></a>
 <a href="#"><img src="09 sporten.png" alt="Sporten"></a>
 <a href="#"><img src="10 lunch.png" alt="Lunch"></a>
 
 <a href="#"><img src="11 diner.png" alt="Diner"></a>
 <a href="#"><img src="12 medicatie supplementen.png" alt="Medicatie en supplementen"></a>
 <a href="#"><img src="13 opruimen.png" alt="Opruimen"></a>
 <a href="#"><img src="14 ontspannen.png" alt="Ontspannen"></a>
 <a href="#"><img src="15 medicatie supplementen.png" alt="Medicatie en supplementen"></a>
</div>

 <section class="afspraken">
 <h2>Afspraken van de dag</h2>
 
 <div class="afspraak">
   <span class="tijd">13:15</span>
   <span class="omschrijving">Test afspraak</span>
 </div>
 
 <div class="afspraak">
   <span class="tijd">16:00</span>
   <span class="omschrijving">Test afspraak 2</span>
 </div>
</section>
 
<script>
const vandaag = new Date().toLocaleDateString('en-CA');
const opgeslagenDag = localStorage.getItem('dashboardDatum');
document.getElementById('datum').textContent =
 new Date().toLocaleDateString('nl-NL', {
   weekday: 'long',
   day: 'numeric',
   month: 'long',
   year: 'numeric'
 });
 
if (opgeslagenDag !== vandaag) {
   localStorage.removeItem('dashboardKlaar');
   localStorage.setItem('dashboardDatum', vandaag);
}
 
let klaar = JSON.parse(localStorage.getItem('dashboardKlaar') || '[]');
const iconen = document.querySelectorAll('.dashboard a');
 function updateVoortgang() {
 const aantalKlaar = document.querySelectorAll('.dashboard a.done').length;
 document.getElementById('voortgang').textContent =
   aantalKlaar + ' van ' + iconen.length + ' gedaan';
  const percentage = (aantalKlaar / iconen.length) * 100;
document.getElementById('voortgang-vulling').style.width = percentage + '%';
}
 
iconen.forEach(function(icon, nummer) {
 
   if (klaar.includes(nummer)) {
       icon.classList.add('done');
   }
 
   icon.addEventListener('click', function(event) {
       event.preventDefault();
       icon.classList.toggle('done');
    updateVoortgang();
 
       klaar = [];
 
       iconen.forEach(function(item, index) {
           if (item.classList.contains('done')) {
               klaar.push(index);
           }
       });
 
       localStorage.setItem('dashboardKlaar', JSON.stringify(klaar));
   });
});

updateVoortgang();
</script>
 
</body>
</html>
