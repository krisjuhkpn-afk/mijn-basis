 .vandagen-banner {
  width: calc(100% + 60px);

}
 #blauwe-dag-icoon {

 h1 {

   font-size: 22px;
   margin-bottom: 25px;
 }
 
 .dashboard {
   display: grid;
   grid-template-columns: repeat(5, minmax(0, 1fr));
   gap: 8px;
   max-width: 760px;
   margin: 0 auto;
   padding: 15px;
}
 
 body.blauwe-dag-actief {

}

.blauwe-dag-actief h1:not(.vandagen-blauw) {

}
 
.blauwe-dag-actief #voortgang {

}
 
.blauwe-dag-actief .dashboard {
  background-color: transparent;
  border-radius: 20px;
  padding: 15px;

}
 .dashboard img {
   display: block;
   width: 100%;
   height: auto;
  
 }
 .dashboard img[src*="medicamentels.png"] {
   transform: scale(1.00);
}
 
 .dashboard a {
   display: block;
   text-decoration: none;
 }

 .dashboard a.done img {
    opacity: 0.30;
}

.dashboard a {

}

 #datum {

  left: 2%;

}
 
#voortgang {
  text-align: center;
  margin: -15px 0 35px 0;
  font-size: 13px;
  font-weight: 600;
}

.voortgang-balk {
   width: calc(100% - 30px);
   max-width: 730px;
   height: 8px;
   background: #F8D4E2;
   border-radius: 10px;
   margin: -22px auto 15px auto;
   overflow: hidden;
}
 
#voortgang-vulling {
   width: 0%;
   height: 100%;
   background: #d9879f;
   border-radius: 10px;
   transition: width 0.3s ease;
}

 .blauwe-dag-actief .voortgang-balk {
  background: #C5E4F8;
}

.blauwe-dag-actief #voortgang-vulling {
  background: #4FA1E0;
}
 
 @media (max-width: 600px) {
   .voortgang-balk {

   }

 .afspraken {
 max-width: 760px;
 margin: 14px auto 0;
}
 
.afspraken h2,

<script>
const vandaag = new Date().toLocaleDateString('en-CA');
const opgeslagenDag = localStorage.getItem('dashboardDatum');
const nu = new Date();

const dagMaand = nu.toLocaleDateString('nl-NL', {
  weekday: 'short',
  day: 'numeric',
  month: 'long'
});

document.getElementById('datum').innerHTML =
  dagMaand + '<br><span class="datum-jaar">' +
  nu.getFullYear() + '</span>';
 
if (opgeslagenDag !== vandaag) {
   localStorage.removeItem('dashboardKlaar');
   localStorage.setItem('dashboardDatum', vandaag);
}
 
let klaar = JSON.parse(localStorage.getItem('dashboardKlaar') || '[]');
const iconen = document.querySelectorAll('.dashboard a');
 function updateVoortgang() {
 const aantalKlaar = document.querySelectorAll('.dashboard a.done').length;
 document.getElementById('voortgang').textContent =
  document.body.classList.contains('blauwe-dag-actief')
    ? 'vandaag mag minder'
    : aantalKlaar + ' van ' + iconen.length + ' gedaan';
  const percentage = (aantalKlaar / iconen.length) * 100;
document.getElementById('voortgang-vulling').style.width = percentage + '%';
}
 
iconen.forEach(function(icon, nummer) {
 
   if (klaar.includes(nummer)) {
       icon.classList.add('done');
   }
 
   icon.addEventListener('click', function(event) {
       event.preventDefault();
       icon.classList.toggle('done');
    updateVoortgang();
 
       klaar = [];
 
       iconen.forEach(function(item, index) {
           if (item.classList.contains('done')) {
               klaar.push(index);
           }
       });
 
       localStorage.setItem('dashboardKlaar', JSON.stringify(klaar));
   });
});

updateVoortgang();

 async function laadAgenda() {
 const vak = document.getElementById('agenda-afspraken');
 
 try {
   const response = await fetch('/api/agenda');
   const afspraken = await response.json();
   const afsprakenTeller = document.getElementById('afspraken-teller');
 
if (afspraken.length === 1) {
   afsprakenTeller.textContent = '1 afspraak vandaag';
} else {
   afsprakenTeller.textContent = afspraken.length + ' afspraken vandaag';
}
 
   vak.innerHTML = '';
 
   afspraken.forEach(afspraak => {
     const regel = document.createElement('div');
     regel.className = 'afspraak';
 
     regel.innerHTML = `
       <span class="tijd">${afspraak.tijd}</span>
       <span class="omschrijving">${afspraak.titel}</span>
     `;
 
     vak.appendChild(regel);
   });
 
 } catch (error) {
   console.error('Agenda kon niet worden geladen:', error);
 }
}
 
laadAgenda();

 async function laadActiepunten() {
 const vak = document.getElementById("google-taken");
 
 try {
   const response = await fetch('/api/tasks');
 
   if (!response.ok) {
     throw new Error("Actiepunten ophalen mislukt");
   }
 
   const alleTaken = await response.json();

  const doedingels = alleTaken.filter(taak =>
  taak.lijst?.toLowerCase() === "mijn taken"
  );

  const doedingelsLijst = document.getElementById("doedingels-lijst");

doedingelsLijst.innerHTML = "";

doedingels.forEach(taak => {
  const regel = document.createElement("label");
 regel.className = "afspraak";

  const vakje = document.createElement("input");
  vakje.type = "checkbox";
 vakje.className = "actiepunt-vinkje";
 
  const tekst = document.createElement("span");
 tekst.style.fontFamily = "Nunito, sans-serif";
tekst.style.fontSize = "12px";
tekst.style.fontWeight = "400";
  tekst.textContent = taak.titel;

  regel.appendChild(vakje);
  regel.appendChild(tekst);
  doedingelsLijst.appendChild(regel);
});
 
   const vandaag = new Date().toLocaleDateString("sv-SE");

const taken = alleTaken.filter(taak => {
  return taak.lijst?.toLowerCase() === "openstaande actiepunten"
    && taak.datum?.slice(0, 10) === vandaag;
});
  
  document.getElementById("priodingels-teller").textContent =
  taken.length + " priodingels vandaag";
 
   vak.innerHTML = "";
 
   if (taken.length === 0) {
  vak.textContent = "";
    
   }
 
   taken.forEach(taak => {
     const regel = document.createElement("div");
     regel.className = "afspraak";
    
const vinkje = document.createElement("input");
vinkje.type = "checkbox";
vinkje.className = "actiepunt-vinkje";
vinkje.setAttribute("aria-label", "Voltooi " + taak.titel);

regel.appendChild(vinkje); 
    const vandaag = new Date().toLocaleDateString("sv-SE");

// Overzicht van bewaarde Reflexels
function toonReflexelGeschiedenis() {
  const overzicht = document.getElementById("reflexel-overzicht");
  overzicht.innerHTML = "";

  const reflexels = JSON.parse(
    localStorage.getItem("vandagen-reflexels") || "[]"
  );

  reflexels.slice().reverse().forEach(reflexel => {
    const knop = document.createElement("button");
    const [jaar, maand, dag] = reflexel.datum.split("-");

    knop.type = "button";
    knop.textContent = `${dag}-${maand}-${jaar}`;

    knop.addEventListener("click", function() {
  const bewaardVak = document.getElementById("reflexel-bewaard");
  const bewaardeTekst = document.getElementById("reflexel-bewaarde-tekst");

  const actueleReflexels = JSON.parse(
  localStorage.getItem("vandagen-reflexels") || "[]"
);
const actueleReflexel = actueleReflexels.find(
  item => item.id === reflexel.id
);
bewaardeTekst.value = actueleReflexel
  ? actueleReflexel.tekst
  : reflexel.tekst;
     bewaardVak.dataset.reflexelId = reflexel.id;
  bewaardVak.style.display = "block";

  bewaardVak.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
});

    overzicht.appendChild(knop);
  });
}

toonReflexelGeschiedenis();
 // Mijn actieve Reflexel
const reflexelTekst = document.getElementById("reflexel-tekst");
const actieveReflexelSleutel = "vandagen-actieve-reflexel";

// Bestaande Reflexel terughalen
let actieveReflexel;

try {
  actieveReflexel = JSON.parse(
    localStorage.getItem(actieveReflexelSleutel) || "null"
  );
} catch (error) {
  actieveReflexel = null;
}

// Eerder geschreven tekst tonen
if (actieveReflexel) {
  reflexelTekst.value = actieveReflexel.tekst;
}

// Automatisch bewaren tijdens het schrijven
reflexelTekst.addEventListener("input", function() {
  const tekst = reflexelTekst.value;

  // Pas een datum vastleggen zodra je iets schrijft
  if (!actieveReflexel && tekst.trim()) {
    actieveReflexel = {
      id: Date.now(),
      datum: new Date().toLocaleDateString("sv-SE"),
      tekst: ""
    };
  }

  if (actieveReflexel) {
    actieveReflexel.tekst = tekst;

    localStorage.setItem(
      actieveReflexelSleutel,
      JSON.stringify(actieveReflexel)
    );
  }
});

 // Huidige Reflexel afronden en een nieuwe beginnen
document.getElementById("reflexel-nieuw").addEventListener("click", function() {
  const tekst = reflexelTekst.value.trim();

  // Geen tekst? Dan hoeft er niets bewaard te worden.
 if (!tekst) {
  document.getElementById("reflexel-bewaard").style.display = "none";
  return;
}

  const reflexels = JSON.parse(
    localStorage.getItem("vandagen-reflexels") || "[]"
  );

  reflexels.push({
    id: actieveReflexel.id,
    datum: actieveReflexel.datum,
    tekst: tekst
  });

  try {
    localStorage.setItem("vandagen-reflexels", JSON.stringify(reflexels));
    localStorage.removeItem(actieveReflexelSleutel);

    actieveReflexel = null;
    reflexelTekst.value = "";
   document.getElementById("reflexel-bewaard").style.display = "none";
   toonReflexelGeschiedenis();

  } catch (error) {
    alert("Bewaren is niet gelukt. Je tekst blijft staan.");
  }
});

 // Wijzigingen in een bewaarde Reflexel opslaan
document.getElementById("reflexel-wijzigingen-opslaan")
  .addEventListener("click", function() {

    const bewaardVak = document.getElementById("reflexel-bewaard");
    const id = bewaardVak.dataset.reflexelId;
    const tekst = document.getElementById("reflexel-bewaarde-tekst").value;

    if (!id) return;

    const reflexels = JSON.parse(
      localStorage.getItem("vandagen-reflexels") || "[]"
    );

    const reflexel = reflexels.find(item => String(item.id) === id);

    if (!reflexel) {
      alert("Deze Reflexel kon niet worden gevonden.");
      return;
    }

    reflexel.tekst = tekst;

    try {
      localStorage.setItem("vandagen-reflexels", JSON.stringify(reflexels));
    } catch (error) {
      alert("Opslaan is niet gelukt.");
    }
});

 // Reflexel kopiëren voor Rosebud
document.getElementById("rosebud-kopieer").addEventListener("click", async function() {
  const tekst = document.getElementById("reflexel-tekst").value;

  if (!tekst.trim()) {
    alert("Er staat nog geen tekst om te kopiëren.");
    return;
  }

  try {
    await navigator.clipboard.writeText(tekst);
    
  } catch (error) {
    alert("Kopiëren is niet gelukt.");
  }
});

 // Bewaarde Reflexel kopiëren voor Rosebud
document.getElementById("rosebud-bewaard-kopieer")
  .addEventListener("click", async function() {

    const tekst = document.getElementById("reflexel-bewaarde-tekst").value;

    if (!tekst.trim()) {
      return;
    }

    try {
      await navigator.clipboard.writeText(tekst);
    } catch (error) {
      alert("Kopiëren is niet gelukt.");
    }
});
