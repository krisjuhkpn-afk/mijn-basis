<!DOCTYPE html>
<html lang="nl">
<head>
 
<link rel="manifest" href="./manifest.json">

 <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Dagelijkse Basis</title>
 
<style>
 body {
  
   margin: 0;
   padding: 0 30px 15px;
   background: #ffffff;
   font-family: Nunito, sans-serif;
 }

 .vandagen-banner {
  max-width: 850px;
  margin: 15px auto 10px;
  text-align: center;
  position: relative;
}

.vandagen-banner img {
  display: block;
  width: 100%;
  height: auto;
}
 
 h1 {
   text-align: center;
   color: #7a1735;
   font-size: 22px;
   margin-bottom: 25px;
 }
 
 .dashboard {
   display: grid;
   grid-template-columns: repeat(5, minmax(0, 1fr));
   gap: 8px;
   max-width: 760px;
   margin: 0 auto;
}
 
 .dashboard img {
   display: block;
   width: 100%;
   height: auto;
  
 }
 .dashboard img[src*="medicamentels.png"] {
   transform: scale(1.08);
}
 
 .dashboard a {
   display: block;
   text-decoration: none;
 }

 .dashboard a.done img {
    opacity: 0.30;
}

.dashboard a {
    cursor: pointer;
}

 #datum {
  position: absolute;
  bottom: 8%;
  left: 9%;
  margin: 0;
  text-align: left;
  color: #8f3b60;
  font-size: 18px;
  font-weight: 700;
}
 .datum-jaar {
  color: #8f3b60;
  font-weight: 400;
  font-size: 14px;
}
 
#voortgang {
   text-align: center;
   margin: 4px 0 20px 0;
   font-size: 16px;
   font-weight: 600;
}

.voortgang-balk {
   width: 100%;
   max-width: 760px;
   height: 8px;
   background: #f7e8ed;
   border-radius: 10px;
   margin: 0 auto 32px auto;
   overflow: hidden;
}
 
#voortgang-vulling {
   width: 0%;
   height: 100%;
   background: #d9879f;
   border-radius: 10px;
   transition: width 0.3s ease;
}

 @media (max-width: 600px) {
   .voortgang-balk {
       margin-bottom: 18px;
   }
}

 .afspraken {
 max-width: 760px;
 margin: 32px auto 0;
}
 
.afspraken h2,
.basis-titel {
 color: #7a1735;
 font-size: 22px;
 margin: 0 0 14px;
 text-align: center;
 }
 
.afspraak {
 display: flex;
 align-items: center;
 gap: 10px;
 background: #fdf2f6;
 border: 1px solid #f3c9d8;
 border-radius: 12px;
 padding: 6px 10px;
 margin-bottom: 8px;
}
 
.tijd {
 background: #f7d6e2;
 color: #7a1735;
 font-weight: 600;
 font-size: 13px;
 border-radius: 9px;
 padding: 5px 8px;
 min-width: 44px;
 text-align: center;
}
 
.omschrijving {
 font-size: 14px;
 font-weight: 400;
}
.afspraak.voltooid {
  background: #f2f2f2;
  border-color: #dddddd;
  opacity: 0.6;
}

.afspraak.voltooid .omschrijving {
  color: #777777;
  text-decoration: none;
}

 .actiepunt-vinkje {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: #a83b60;
  cursor: pointer;
  flex-shrink: 0;
}
 @media (max-width: 600px) {
   body {
      padding-left: 10px;
      padding-right: 10px;
   }

   .dashboard {
      gap: 7px;
   }
}
 
</style>
</head>
 
<body>
 
<div class="vandagen-banner">
  <img src="vandagen banner.png" alt="Vandagen">
  <p id="datum"></p>
</div>
<p id="blauwe-dag" style="display:none;">Vandaag is een blauwe dag</p>
<p id="afspraken-teller"></p>
<p id="actiepunten-teller"></p>
 
<h2 class="basis-titel">Dagelijkse Basis</h2>
<p id="voortgang"></p>

 <div class="voortgang-balk">
   <div id="voortgang-vulling"></div>
</div>
 
 
<div class="dashboard">
  <a href="#"><img src="01 lichtbril.png" alt="Lichtbril"></a>
  <a href="#"><img src="02 medicamentels.png" alt="Medicamentels"></a>
  <a href="#"><img src="03 badderen.png" alt="Badderen"></a>
  <a href="#"><img src="04 aankleden.png" alt="Aankleden"></a>

  <a href="#"><img src="05 tandenpoetsen.png" alt="Tandenpoetsen"></a>
  <a href="#"><img src="06 wandelen.png" alt="Wandelen"></a>
  <a href="#"><img src="07 ontbijt.png" alt="Ontbijt"></a>
  <a href="#"><img src="08 medicamentels.png" alt="Medicamentels"></a>

  <a href="#"><img src="09 huisrommelen.png" alt="Huisrommelen"></a>
  <a href="#"><img src="10 lunch.png" alt="Lunch"></a>
  <a href="#"><img src="11 sporten.png" alt="Sporten"></a>
  <a href="#"><img src="12 diner.png" alt="Diner"></a>

  <a href="#"><img src="13 medicamentels.png" alt="Medicamentels"></a>
  <a href="#"><img src="14 ontspannen.png" alt="Ontspannen"></a>
  <a href="#"><img src="15 medicamentels.png" alt="Medicamentels"></a>
</div>


<section class="afspraken">
   <h2>Afspraken van de dag</h2>
 
   <div id="agenda-afspraken"></div>
</section>

 <section class="afspraken" id="openstaande-actiepunten">
 <h2>Openstaande actiepunten</h2>
 <div id="google-taken">Taken worden geladen...</div>
</section>
 
<script>
const vandaag = new Date().toLocaleDateString('en-CA');
const opgeslagenDag = localStorage.getItem('dashboardDatum');
const nu = new Date();

const dagMaand = nu.toLocaleDateString('nl-NL', {
  weekday: 'short',
  day: 'numeric',
  month: 'long'
});

document.getElementById('datum').innerHTML =
  dagMaand + '<br><span class="datum-jaar">' +
  nu.getFullYear() + '</span>';
 
if (opgeslagenDag !== vandaag) {
   localStorage.removeItem('dashboardKlaar');
   localStorage.setItem('dashboardDatum', vandaag);
}
 
let klaar = JSON.parse(localStorage.getItem('dashboardKlaar') || '[]');
const iconen = document.querySelectorAll('.dashboard a');
 function updateVoortgang() {
 const aantalKlaar = document.querySelectorAll('.dashboard a.done').length;
 document.getElementById('voortgang').textContent =
   aantalKlaar + ' van ' + iconen.length + ' gedaan';
  const percentage = (aantalKlaar / iconen.length) * 100;
document.getElementById('voortgang-vulling').style.width = percentage + '%';
}
 
iconen.forEach(function(icon, nummer) {
 
   if (klaar.includes(nummer)) {
       icon.classList.add('done');
   }
 
   icon.addEventListener('click', function(event) {
       event.preventDefault();
       icon.classList.toggle('done');
    updateVoortgang();
 
       klaar = [];
 
       iconen.forEach(function(item, index) {
           if (item.classList.contains('done')) {
               klaar.push(index);
           }
       });
 
       localStorage.setItem('dashboardKlaar', JSON.stringify(klaar));
   });
});

updateVoortgang();

 async function laadAgenda() {
 const vak = document.getElementById('agenda-afspraken');
 
 try {
   const response = await fetch('/api/agenda');
   const afspraken = await response.json();
   const afsprakenTeller = document.getElementById('afspraken-teller');
 
if (afspraken.length === 1) {
   afsprakenTeller.textContent = '1 afspraak vandaag';
} else {
   afsprakenTeller.textContent = afspraken.length + ' afspraken vandaag';
}
 
   vak.innerHTML = '';
 
   afspraken.forEach(afspraak => {
     const regel = document.createElement('div');
     regel.className = 'afspraak';
 
     regel.innerHTML = `
       <span class="tijd">${afspraak.tijd}</span>
       <span class="omschrijving">${afspraak.titel}</span>
     `;
 
     vak.appendChild(regel);
   });
 
 } catch (error) {
   console.error('Agenda kon niet worden geladen:', error);
 }
}
 
laadAgenda();

 async function laadActiepunten() {
 const vak = document.getElementById("google-taken");
 
 try {
   const response = await fetch('/api/tasks');
 
   if (!response.ok) {
     throw new Error("Actiepunten ophalen mislukt");
   }
 
   const alleTaken = await response.json();
 
   const taken = alleTaken.filter(
     taak => taak.lijst === "Openstaande Actiepunten"
   );
 
   vak.innerHTML = "";
 
   if (taken.length === 0) {
     vak.textContent = "Geen openstaande actiepunten";
     return;
   }
 
   taken.forEach(taak => {
     const regel = document.createElement("div");
     regel.className = "afspraak";
    
const vinkje = document.createElement("input");
vinkje.type = "checkbox";
vinkje.className = "actiepunt-vinkje";
vinkje.setAttribute("aria-label", "Voltooi " + taak.titel);

regel.appendChild(vinkje); 
    const vandaag = new Date().toLocaleDateString("sv-SE");
const opslagSleutel = "actiepunt-" + vandaag + "-" + taak.id;

vinkje.checked = localStorage.getItem(opslagSleutel) === "true";
regel.classList.toggle("voltooid", vinkje.checked);

vinkje.addEventListener("change", async () => {
  const voltooid = vinkje.checked;

  regel.classList.toggle("voltooid", voltooid);

  if (!voltooid) {
    localStorage.removeItem(opslagSleutel);
    return;
  }

  try {
    const response = await fetch("/api/tasks/complete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: taak.id,
        lijstId: taak.lijstId
      })
    });

    if (!response.ok) {
      throw new Error("Voltooien mislukt");
    }

    localStorage.setItem(opslagSleutel, "true");

  } catch (error) {
    vinkje.checked = false;
    regel.classList.remove("voltooid");
    localStorage.removeItem(opslagSleutel);
    alert("Het actiepunt kon niet worden voltooid.");
    console.error(error);
  }
});
    
     const titel = document.createElement("span");
     titel.className = "omschrijving";
     titel.textContent = taak.titel;
 
     regel.appendChild(titel);
     vak.appendChild(regel);
   });
 
 } catch (error) {
   vak.textContent = "Actiepunten konden niet worden geladen";
   console.error(error);
 }
}
 
laadActiepunten();

 
async function testBeveiligdeVerbinding() {
  try {
    const response = await fetch('/api/agenda');

    console.log("Cloudflare test:", response.status);
  } catch (error) {
    console.error("Cloudflare verbinding mislukt:", error);
  }
}

// testBeveiligdeVerbinding();

</script>
 
</body>
</html>
