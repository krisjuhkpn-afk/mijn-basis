<!DOCTYPE html>
<html lang="nl">
<head>
 
<link rel="manifest" href="./manifest.json">

 <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Dagelijkse Basis</title>
 
<style>
 body {
  
   margin: 0;
   padding: 0 30px 15px;
   background: #ffffff;
   font-family: Nunito, sans-serif;
 }

 .vandagen-banner {
  max-width: 850px;
  margin: 15px auto 0px;
  text-align: center;
  position: relative;
}

.vandagen-banner img {
  display: block;
  width: 100%;
  height: auto;
}
 #blauwe-dag-icoon {
  display: block;
  width: 120px;
  height: auto;
  margin: 0 max(0px, calc((100% - 760px) / 2)) 0 auto;
  cursor: pointer;
}
 
 #afspraken-teller {
  max-width: 760px;
  margin: -35px auto 15px;
  padding-left: 15px;
  box-sizing: border-box;
  text-align: left;
  font-size: 16px;
}

 #priodingels-teller {
  max-width: 760px;
  margin: -10px auto 15px;
  padding-left: 15px;
  box-sizing: border-box;
  text-align: left;
  font-size: 16px;
}
 
 h1 {
   text-align: center;
   color: #7a1735;
   font-size: 22px;
   margin-bottom: 25px;
 }
 
 .dashboard {
   display: grid;
   grid-template-columns: repeat(5, minmax(0, 1fr));
   gap: 8px;
   max-width: 760px;
   margin: 0 auto;
}
 body.blauwe-dag-actief {
  background-color: #DCEFFD;
}

.blauwe-dag-actief .dashboard {
  background-color: transparent;
  border-radius: 20px;
  padding: 15px;
  box-sizing: border-box;
}
 .dashboard img {
   display: block;
   width: 100%;
   height: auto;
  
 }
 .dashboard img[src*="medicamentels.png"] {
   transform: scale(1.08);
}
 
 .dashboard a {
   display: block;
   text-decoration: none;
 }

 .dashboard a.done img {
    opacity: 0.30;
}

.dashboard a {
    cursor: pointer;
}

 #datum {
  position: absolute;
  bottom: 8%;
  left: 9%;
  margin: 0;
  text-align: left;
  color: #8f3b60;
  font-size: 18px;
  font-weight: 700;
}
 .datum-jaar {
  color: #8f3b60;
  font-weight: 400;
  font-size: 14px;
}
 
#voortgang {
   text-align: center;
   margin: 4px 0 20px 0;
   font-size: 16px;
   font-weight: 600;
}

.voortgang-balk {
   width: 100%;
   max-width: 760px;
   height: 8px;
   background: #f7e8ed;
   border-radius: 10px;
   margin: 0 auto 32px auto;
   overflow: hidden;
}
 
#voortgang-vulling {
   width: 0%;
   height: 100%;
   background: #d9879f;
   border-radius: 10px;
   transition: width 0.3s ease;
}

 @media (max-width: 600px) {
   .voortgang-balk {
       margin-bottom: 18px;
   }
}

 .afspraken {
 max-width: 760px;
 margin: 32px auto 0;
}
 
.afspraken h2,
.basis-titel {
 color: #7a1735;
 font-size: 22px;
 margin: 0 0 14px;
 text-align: center;
 }
 
.afspraak {
 display: flex;
 align-items: center;
 gap: 10px;
 background: #fdf2f6;
 border: 1px solid #f3c9d8;
 border-radius: 12px;
 padding: 6px 10px;
 margin-bottom: 8px;
}
 
.tijd {
 background: #f7d6e2;
 color: #7a1735;
 font-weight: 600;
 font-size: 13px;
 border-radius: 9px;
 padding: 5px 8px;
 min-width: 44px;
 text-align: center;
}
 
.omschrijving {
 font-size: 14px;
 font-weight: 400;
}
.afspraak.voltooid {
  background: #f2f2f2;
  border-color: #dddddd;
  opacity: 0.6;
}

.afspraak.voltooid .omschrijving {
  color: #777777;
  text-decoration: none;
}

 .actiepunt-vinkje {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: #a83b60;
  cursor: pointer;
  flex-shrink: 0;
}
 @media (max-width: 600px) {
   body {
      padding-left: 10px;
      padding-right: 10px;
   }

   .dashboard {
      gap: 7px;
   }
}

 #vandaag-is-blauw {
  width: 280px;
  max-width: 100%;
  height: auto;
  margin: 0;
}
 .dag-keuze {
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 660px;
  margin: 5px auto 15px;
}

#vandaag-is-blauw {
  width: 240px;
  height: auto;
}

#blauwe-dag-icoon {
  width: 100px;
  height: auto;
  cursor: pointer;
}
 #blauwe-dag-banner {
  width: 100%;
  max-width: 760px;
  margin: 15px auto;
}

#blauwe-dag-banner img {
  display: block;
  width: 100%;
  height: auto;
}
 .onderste-navigatie {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  width: 90%;
  max-width: 650px;
  margin: 30px auto;
}

.onderste-navigatie img {
  display: block;
  width: 22%;
  max-width: 100px;
  height: auto;
  object-fit: contain;
  cursor: pointer;
}
 
</style>
</head>
 
<body>
 
<div class="vandagen-banner" id="gewone-dag-banner">
  <img src="vandagen banner.png" alt="Vandagen">
  <p id="datum"></p>
</div>

 <div id="blauwe-dag-banner" style="display:none;">
  <img src="Een blauwe dag van rust.png" alt="Vandaag is een blauwe dag">
</div>

 <div class="dag-keuze">

  <img src="vandaag_is_blauw_transparant.png"
       alt="Vandaag is Blauw"
       id="vandaag-is-blauw"
       style="display:none;">

  <img src="icoontje blauwe dag.png"
       alt="Mijn Blauwe Dag"
       id="blauwe-dag-icoon"
       role="button"
       tabindex="0"
       aria-pressed="false">

</div>
 
<p id="blauwe-dag" style="display:none;"></p>
<p id="afspraken-teller"></p>
<p id="actiepunten-teller"></p>
<p id="priodingels-teller"></p>
 
<h2 class="basis-titel">Dagelijkse Basis</h2>
<p id="voortgang"></p>

 <div class="voortgang-balk">
   <div id="voortgang-vulling"></div>
</div>
 
 
<div class="dashboard">
  <a href="#"><img src="01 lichtbril.png" alt="Lichtbril"></a>
  <a href="#"><img src="02 medicamentels.png" alt="Medicamentels"></a>
  <a href="#"><img src="03 badderen.png" alt="Badderen"></a>
  <a href="#"><img src="04 aankleden.png" alt="Aankleden"></a>

  <a href="#"><img src="05 tandenpoetsen.png" alt="Tandenpoetsen"></a>
  <a href="#"><img src="06 wandelen.png" alt="Wandelen"></a>
  <a href="#"><img src="07 ontbijt.png" alt="Ontbijt"></a>
  <a href="#"><img src="08 medicamentels.png" alt="Medicamentels"></a>

  <a href="#"><img src="09 huisrommelen.png" alt="Huisrommelen"></a>
  <a href="#"><img src="10 lunch.png" alt="Lunch"></a>
  <a href="#"><img src="11 sporten.png" alt="Sporten"></a>
  <a href="#"><img src="12 diner.png" alt="Diner"></a>

  <a href="#"><img src="13 medicamentels.png" alt="Medicamentels"></a>
  <a href="#"><img src="14 ontspannen.png" alt="Ontspannen"></a>
  <a href="#"><img src="15 medicamentels.png" alt="Medicamentels"></a>
</div>

 <div id="blauwe-dag-afbeelding" style="display:none; max-width:760px; margin:20px auto;">
  <img src="Een blauwe dag van rust.png"
       alt="Vandaag is een blauwe dag"
       style="display:block; width:100%; height:auto;">
</div>

<section class="afspraken" id="afspraken-sectie">
   <h2>Afspraken van de dag</h2>
 
   <div id="agenda-afspraken"></div>
</section>

 <section class="afspraken" id="openstaande-actiepunten">
 <h2>Openstaande actiepunten</h2>
 <div id="google-taken">Taken worden geladen...</div>
</section>

  <nav class="onderste-navigatie">
  <img id="nav-wissel"
     src="blauw blad wisselicoon.png"
     alt="Wissel tussen gewone en blauwe dag"
     role="button"
     tabindex="0">
  <img id="nav-agenda" src="agenda_roze.png" alt="Agenda">
  <img id="nav-doedingels" src="doedingels_roze.png" alt="Doedingels">
  <img id="nav-reflexel" src="reflexel_roze.png" alt="Reflexel">
</nav>
 
<script>
const vandaag = new Date().toLocaleDateString('en-CA');
const opgeslagenDag = localStorage.getItem('dashboardDatum');
const nu = new Date();

const dagMaand = nu.toLocaleDateString('nl-NL', {
  weekday: 'short',
  day: 'numeric',
  month: 'long'
});

document.getElementById('datum').innerHTML =
  dagMaand + '<br><span class="datum-jaar">' +
  nu.getFullYear() + '</span>';
 
if (opgeslagenDag !== vandaag) {
   localStorage.removeItem('dashboardKlaar');
   localStorage.setItem('dashboardDatum', vandaag);
}
 
let klaar = JSON.parse(localStorage.getItem('dashboardKlaar') || '[]');
const iconen = document.querySelectorAll('.dashboard a');
 function updateVoortgang() {
 const aantalKlaar = document.querySelectorAll('.dashboard a.done').length;
 document.getElementById('voortgang').textContent =
   aantalKlaar + ' van ' + iconen.length + ' gedaan';
  const percentage = (aantalKlaar / iconen.length) * 100;
document.getElementById('voortgang-vulling').style.width = percentage + '%';
}
 
iconen.forEach(function(icon, nummer) {
 
   if (klaar.includes(nummer)) {
       icon.classList.add('done');
   }
 
   icon.addEventListener('click', function(event) {
       event.preventDefault();
       icon.classList.toggle('done');
    updateVoortgang();
 
       klaar = [];
 
       iconen.forEach(function(item, index) {
           if (item.classList.contains('done')) {
               klaar.push(index);
           }
       });
 
       localStorage.setItem('dashboardKlaar', JSON.stringify(klaar));
   });
});

updateVoortgang();

 async function laadAgenda() {
 const vak = document.getElementById('agenda-afspraken');
 
 try {
   const response = await fetch('/api/agenda');
   const afspraken = await response.json();
   const afsprakenTeller = document.getElementById('afspraken-teller');
 
if (afspraken.length === 1) {
   afsprakenTeller.textContent = '1 afspraak vandaag';
} else {
   afsprakenTeller.textContent = afspraken.length + ' afspraken vandaag';
}
 
   vak.innerHTML = '';
 
   afspraken.forEach(afspraak => {
     const regel = document.createElement('div');
     regel.className = 'afspraak';
 
     regel.innerHTML = `
       <span class="tijd">${afspraak.tijd}</span>
       <span class="omschrijving">${afspraak.titel}</span>
     `;
 
     vak.appendChild(regel);
   });
 
 } catch (error) {
   console.error('Agenda kon niet worden geladen:', error);
 }
}
 
laadAgenda();

 async function laadActiepunten() {
 const vak = document.getElementById("google-taken");
 
 try {
   const response = await fetch('/api/tasks');
 
   if (!response.ok) {
     throw new Error("Actiepunten ophalen mislukt");
   }
 
   const alleTaken = await response.json();
 
   const taken = alleTaken.filter(
     taak => taak.lijst === "Openstaande Actiepunten"
   );
  
  document.getElementById("priodingels-teller").textContent =
  taken.length + " priodingels vandaag";
 
   vak.innerHTML = "";
 
   if (taken.length === 0) {
  vak.textContent = "";
    
   }
 
   taken.forEach(taak => {
     const regel = document.createElement("div");
     regel.className = "afspraak";
    
const vinkje = document.createElement("input");
vinkje.type = "checkbox";
vinkje.className = "actiepunt-vinkje";
vinkje.setAttribute("aria-label", "Voltooi " + taak.titel);

regel.appendChild(vinkje); 
    const vandaag = new Date().toLocaleDateString("sv-SE");
const opslagSleutel = "actiepunt-" + vandaag + "-" + taak.id;

vinkje.checked = localStorage.getItem(opslagSleutel) === "true";
   regel.classList.toggle("voltooid", vinkje.checked);

vinkje.addEventListener("change", async () => {
  const voltooid = vinkje.checked;

  regel.classList.toggle("voltooid", voltooid);

  if (!voltooid) {
    localStorage.removeItem(opslagSleutel);
    return;
  }

  try {
    const response = await fetch("/api/tasks/complete", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        id: taak.id,
        lijstId: taak.lijstId
      })
    });

    if (!response.ok) {
      throw new Error("Voltooien mislukt");
    }

    localStorage.setItem(opslagSleutel, "true");
   const bewaardeTaken = JSON.parse(
  localStorage.getItem("afgeronde-priodingels-" + vandaag) || "[]"
);

if (!bewaardeTaken.some(item => item.id === taak.id)) {
  bewaardeTaken.push({
    id: taak.id,
    titel: taak.titel
  });
}

localStorage.setItem(
  "afgeronde-priodingels-" + vandaag,
  JSON.stringify(bewaardeTaken)
);
   const teller = document.getElementById("priodingels-teller");
const huidigAantal = Number(teller.textContent.match(/^\d+/)?.[0] || 0);
teller.textContent = Math.max(0, huidigAantal - 1) + " priodingels vandaag";

  } catch (error) {
    vinkje.checked = false;
    regel.classList.remove("voltooid");
    localStorage.removeItem(opslagSleutel);
    alert("Het actiepunt kon niet worden voltooid.");
    console.error(error);
  }
});
    
     const titel = document.createElement("span");
     titel.className = "omschrijving";
     titel.textContent = taak.titel;
 
     regel.appendChild(titel);
     vak.appendChild(regel);
   });

  const vandaagDatum = new Date().toLocaleDateString("sv-SE");

const afgerondeTaken = JSON.parse(
  localStorage.getItem("afgeronde-priodingels-" + vandaagDatum) || "[]"
);

afgerondeTaken.forEach(taak => {
  if (taken.some(openTaak => openTaak.id === taak.id)) return;

  const regel = document.createElement("div");
  regel.className = "afspraak voltooid";

  const vinkje = document.createElement("input");
  vinkje.type = "checkbox";
  vinkje.className = "actiepunt-vinkje";
  vinkje.checked = true;
  vinkje.disabled = true;

  const titel = document.createElement("span");
  titel.className = "omschrijving";
  titel.textContent = taak.titel;

  regel.appendChild(vinkje);
  regel.appendChild(titel);
  vak.appendChild(regel);
});
  
 } catch (error) {
   vak.textContent = "Actiepunten konden niet worden geladen";
   console.error(error);
 }
}
 
laadActiepunten();

// testBeveiligdeVerbinding();

 // Mijn Blauwe Dag
const blauweDagIcoon = document.getElementById("blauwe-dag-icoon");
const blauweDagMelding = document.getElementById("blauwe-dag");

const blauweDagSleutel =
  "blauwe-dag-" + new Date().toLocaleDateString("sv-SE");

function toonBlauweDag() {
  const actief = localStorage.getItem(blauweDagSleutel) === "true";
  document.body.classList.toggle("blauwe-dag-actief", actief);
  document.getElementById("gewone-dag-banner").style.display = actief ? "none" : "";
  document.getElementById("blauwe-dag-banner").style.display = actief ? "block" : "none";

  blauweDagMelding.style.display = actief ? "block" : "none";
  document.getElementById("afspraken-teller").style.display = actief ? "none" : "";
  document.getElementById("afspraken-sectie").style.display = actief ? "none" : "";
  document.getElementById("openstaande-actiepunten").style.display = actief ? "none" : "";
  document.getElementById("priodingels-teller").style.display = actief ? "none" : "";
  document.getElementById("blauwe-dag-afbeelding").style.display = actief ? "block" : "none";
  document.getElementById("vandaag-is-blauw").style.display =
  actief ? "block" : "none";
  blauweDagIcoon.setAttribute("aria-pressed", String(actief));
  blauweDagIcoon.src = actief
  ? "roze blad wisselicoon.png"
  : "blauw blad wisselicoon.png";
}

function wisselBlauweDag() {
  const actief = localStorage.getItem(blauweDagSleutel) === "true";
  localStorage.setItem(blauweDagSleutel, String(!actief));
  toonBlauweDag();
}

blauweDagIcoon.addEventListener("click", wisselBlauweDag);
 document.getElementById("nav-wissel").addEventListener("click", wisselBlauweDag);

blauweDagIcoon.addEventListener("keydown", function(event) {
  if (event.key === "Enter" || event.key === " ") {
    event.preventDefault();
    wisselBlauweDag();
  }
});

toonBlauweDag();
 
</script>


 
</body>
</html>
